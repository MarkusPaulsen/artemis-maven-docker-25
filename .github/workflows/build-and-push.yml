name: Build and Push

on:
  pull_request:
  push:
    branches:
      - main
      - release/*
    tags: '*'
  release:
    types:
      - created

jobs:
  buildx:
    name: Build and Push the Docker Images
    runs-on: ubuntu-latest
    # Docker Hub credentials are not set on a fork. The login, GHCR-login and build/push steps below
    # skip cleanly when DOCKER_USERNAME is absent, so the job stays green on a fork instead of
    # failing the non-interactive `docker login`. Upstream, where the secrets exist, every step runs.
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Compute Tag
        uses: actions/github-script@v6
        id: compute-tag
        with:
          result-encoding: string
          script: |
            if (context.eventName === "pull_request") {
              return "pr-" + context.issue.number;
            }
            if (context.eventName === "push") {
              if (context.ref.startsWith("refs/tags/")) {
                return context.ref.slice(10);
              }
              if (context.ref === "refs/heads/main") {
                return "latest";
              }
            }
            return "FALSE";

      - uses: actions/checkout@v2

      -
        name: Docker Login
        id: docker-login
        if: ${{ env.DOCKER_USERNAME != '' }}
        run: |
          docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"

      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ steps.compute-tag.outputs.result != 'FALSE' && env.DOCKER_USERNAME != '' }}

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      -
        name: Install Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          version: latest

      -
        name: Build Image and Push to GitHub Container Registry and DockerHub
        uses: docker/build-push-action@v6
        if: ${{ steps.compute-tag.outputs.result != 'FALSE' && env.DOCKER_USERNAME != '' }}
        with:
          context: .
          tags: |
            ls1tum/artemis-maven-template:${{ steps.compute-tag.outputs.result }}
            ghcr.io/ls1intum/artemis-maven-docker:${{ steps.compute-tag.outputs.result }}
          platforms: linux/amd64,linux/arm64/v8
          push: ${{ !startsWith(steps.compute-tag.outputs.result, 'pr-') }}
