# Maven-shaped Phobos base policy for the E2E harness. The shipped BaseLanguage-java.cfg is
# Gradle-shaped (/root/.gradle, gradlew, build) and cannot carry `mvn test`; this grants Maven's
# own paths so the wrapped `mvn -o test` runs, and nothing more. Probe targets under /var/tmp/probe
# and network rules are added per case, never here, so absence means default-deny.
# The working directory is /var/tmp/testing-dir (set by TailPhobos.cfg --chdir).

[read]
/bin
/dev/urandom
/dev/null
/etc
/lib
/lib/x86_64-linux-gnu
/lib64
/opt
/opt/java/openjdk
/usr
/home/sandbox/.m2
/var/tmp/testing-dir
/tmp

[execute]
/bin
/etc
/lib
/lib/x86_64-linux-gnu
/lib64
/opt
/opt/java/openjdk
/usr

[write]
/home/sandbox/.m2
/var/tmp/testing-dir/target
/dev/null
/tmp

[create]
/home/sandbox/.m2
/var/tmp/testing-dir/target
/dev/null
/tmp

[delete]
/home/sandbox/.m2
/var/tmp/testing-dir/target
/dev/null
/tmp
