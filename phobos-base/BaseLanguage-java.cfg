# Maven-shaped Phobos base policy for this image. This image runs Maven (CMD ["mvn"], and the
# smoke test builds with Maven), but the phobos core it embeds ships only a Gradle-shaped
# BaseLanguage-java.cfg (/root/.gradle, gradlew, build) which cannot carry `mvn test`. The
# Dockerfile replaces that shipped base with this one. Structure mirrors the shipped Gradle base,
# translated to Maven paths (/root/.m2, target, pom.xml).
#
# Assumptions, matching the shipped Gradle base it replaces: grading runs as root with the project
# unpacked at /var/tmp/testing-dir. A non-root grading user needs the /root/.m2 entries pointed at
# that user's own repository, and note that Phobos' nproc rlimit only constrains a non-root process
# (root bypasses RLIMIT_NPROC), so the container's own --pids-limit remains the hard fork-bomb cap.

[read]
/bin
/dev/urandom
/dev/null
/etc
/lib
/lib/x86_64-linux-gnu
/lib64
/opt
/opt/java/openjdk
/usr
/root/.m2
/var/tmp/testing-dir
/tmp

[execute]
/bin
/etc
/lib
/lib/x86_64-linux-gnu
/lib64
/opt
/opt/java/openjdk
/usr

[write]
/root/.m2
/var/tmp/testing-dir/target
/dev/null
/tmp

[create]
/root/.m2
/var/tmp/testing-dir/target
/dev/null
/tmp

[delete]
/root/.m2
/var/tmp/testing-dir/target
/dev/null
/tmp

[connect]
allow 127.0.0.1:*
allow [::1]
allow localhost
